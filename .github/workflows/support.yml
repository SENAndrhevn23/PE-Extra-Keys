name: "Bug Report / Feedback / Help"
description: "Report a bug, share ideas, or request help with Extra Keys for Psych Engine 1.0.4."
title: ""
labels: ["bug", "feedback", "help"]
assignees: []

body:
  - type: checkboxes
    id: issue-type
    attributes:
      label: Which issue is this?
      description: Choose the category that best describes your issue.
      options:
        - label: Bug
        - label: Feedback
        - label: Ideas
        - label: Help

  - type: textarea
    id: crash-log
    attributes:
      label: Log / Crash Report
      description: If you have a log file or crash dump, please paste it here when the game crashes.
      placeholder: Paste your crash log or error text here...
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: What version?
      description: Enter your current version of the Extra Keys port.
      placeholder: "example: 0.0.1"
    validations:
      required: true
