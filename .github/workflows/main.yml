name: Build All Platforms

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: 'Windows', os: 'windows-latest', target: 'windows' }
          - { name: 'macOS', os: 'macos-latest', target: 'mac' }
          - { name: 'Linux', os: 'ubuntu-latest', target: 'linux' }
          - { name: 'iOS', os: 'macos-latest', target: 'ios' }
          - { name: 'Android', os: 'ubuntu-latest', target: 'android' }
          - { name: 'HTML5', os: 'ubuntu-latest', target: 'html5' }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Configure Haxelib & Install Dependencies
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib
          haxelib install lime
          haxelib install openfl
          # Add any other required libraries here, e.g.: haxelib install flixel

      - name: Setup Java (Android Only)
        if: matrix.platform.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '17'

      - name: Setup Android SDK (Android Only)
        if: matrix.platform.target == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Linux Dependencies (Linux HTML5/Native Only)
        if: matrix.platform.os == 'ubuntu-latest' && matrix.platform.target != 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev

      - name: Build Target
        run: |
          haxelib run lime build ${{ matrix.platform.target }} --app-version="4.0.0-30173053314" -D officialBuild -D HXCPP_COMPILE_THREADS=4
